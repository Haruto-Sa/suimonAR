<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>suimonAR Location Audio</title>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top right, rgba(245, 158, 11, 0.18), transparent 22%),
          radial-gradient(circle at bottom left, rgba(56, 189, 248, 0.2), transparent 26%),
          #04111a;
        color: #f7f9fc;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #xr-root {
        position: fixed;
        inset: 0;
      }

      /* ---- Startup overlay ---- */
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at top left, rgba(14, 165, 233, 0.24), transparent 24%), rgba(4, 17, 26, 0.9);
        backdrop-filter: blur(12px);
      }
      .card {
        width: min(560px, 100%);
        padding: 24px 28px 28px;
        border-radius: 28px;
        border: 1px solid rgba(255,255,255,0.16);
        background: rgba(10, 23, 34, 0.88);
        box-shadow: 0 30px 80px rgba(0,0,0,0.3);
        overflow: hidden;
      }

      /* ---- Tab navigation ---- */
      .panel-tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 18px;
      }
      .panel-tab {
        flex: 1;
        padding: 8px 10px;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.06);
        color: rgba(247,249,252,0.7);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.2s, color 0.2s;
      }
      .panel-tab.active {
        background: rgba(255,255,255,0.14);
        color: #fff;
        font-weight: 700;
        border-color: rgba(255,255,255,0.28);
      }

      /* ---- Config panel content ---- */
      h1 {
        margin: 0 0 10px;
        font-size: 28px;
      }
      p {
        margin: 0 0 12px;
        line-height: 1.7;
        color: rgba(247,249,252,0.82);
      }
      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .field {
        display: grid;
        gap: 8px;
        margin-bottom: 14px;
      }
      .field label {
        font-size: 13px;
        color: rgba(247,249,252,0.72);
      }
      .field select {
        width: 100%;
        padding: 10px 14px;
        border-radius: 14px;
        border: 1px solid rgba(255,255,255,0.16);
        background: rgba(255,255,255,0.08);
        color: #fff;
        font: inherit;
      }
      .field-help {
        margin: 0 0 14px;
        font-size: 13px;
        color: rgba(247,249,252,0.68);
      }
      .btn, .link-btn {
        border: 0;
        border-radius: 999px;
        padding: 12px 18px;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }
      .btn {
        color: #05121c;
        background: linear-gradient(135deg, #f59e0b, #7dd3fc);
      }
      .btn:disabled { opacity: 0.5; }
      .link-btn {
        color: #fff;
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.16);
      }
      .status {
        margin-top: 12px;
        padding: 10px 14px;
        border-radius: 14px;
        background: rgba(255,255,255,0.06);
        color: #dbeafe;
        font-size: 13px;
      }

      /* ---- Map panel ---- */
      .map-panel-title {
        margin: 0 0 12px;
        font-size: 18px;
        font-weight: 700;
      }
      #map-canvas {
        width: 100%;
        height: auto;
        border-radius: 14px;
        display: block;
        margin-bottom: 10px;
        background: #0a0f1e;
      }
      #map-status {
        font-size: 12px;
        color: rgba(247,249,252,0.55);
        margin: 0 0 6px;
      }

      /* ---- Top bar ---- */
      .top-bar {
        position: fixed;
        top: 18px;
        left: 18px;
        right: 18px;
        z-index: 7;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        pointer-events: none;
      }
      .top-bar > * { pointer-events: auto; }
      .top-bar-right {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .back-link,
      .top-button {
        padding: 10px 16px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.12);
        font: inherit;
        font-weight: 700;
        color: #fff;
        background: rgba(8, 11, 25, 0.78);
        backdrop-filter: blur(10px);
        cursor: pointer;
      }
      .top-button[hidden] { display: none; }

      /* Floating "show UI" button */
      .show-ui-btn {
        position: fixed;
        top: 18px;
        right: 18px;
        z-index: 20;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.2);
        background: rgba(8, 11, 25, 0.85);
        backdrop-filter: blur(10px);
        color: #fff;
        font-size: 18px;
        cursor: pointer;
        display: grid;
        place-items: center;
        pointer-events: auto;
      }
      .show-ui-btn[hidden] { display: none; }

      /* ---- HUD ---- */
      .hud {
        position: fixed;
        left: 18px;
        right: 18px;
        bottom: 18px;
        z-index: 6;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        pointer-events: none;
      }
      .hud[hidden] { display: none; }
      .hud-card {
        padding: 10px 12px;
        border-radius: 16px;
        background: rgba(8, 11, 25, 0.8);
        border: 1px solid rgba(255,255,255,0.12);
        backdrop-filter: blur(10px);
        pointer-events: auto;
      }
      .hud strong {
        display: block;
        margin-bottom: 4px;
        font-size: 12px;
      }
      .hud p {
        margin: 0;
        color: rgba(247,249,252,0.74);
        font-size: 11px;
      }

      /* ---- Audio player ---- */
      .audio-player {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 4px;
      }
      .audio-play-btn {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 0;
        background: linear-gradient(135deg, #f59e0b, #7dd3fc);
        color: #05121c;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        flex-shrink: 0;
        display: grid;
        place-items: center;
      }
      .audio-play-btn:disabled { opacity: 0.45; cursor: default; }
      .audio-seek-wrap {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .audio-seek {
        width: 100%;
        height: 3px;
        accent-color: #7dd3fc;
        cursor: pointer;
        margin: 0;
      }
      .audio-seek:disabled { opacity: 0.4; cursor: default; }
      .audio-time {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: rgba(247,249,252,0.5);
      }

      /* ---- Responsive ---- */
      @media (max-width: 900px) {
        .hud { grid-template-columns: 1fr 1fr; }
      }
      @media (max-width: 640px) {
        .hud { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="xr-root"></div>

      <div class="top-bar">
        <button id="page-back-button" class="back-link" type="button">← 戻る</button>
        <div class="top-bar-right">
          <button id="toggle-hud-button" class="top-button" type="button" hidden disabled>UI を隠す</button>
          <button id="end-ar-button" class="top-button" type="button" hidden disabled>AR を終了</button>
        </div>
      </div>

      <button id="show-ui-button" class="show-ui-btn" type="button" hidden aria-label="UI を表示">☰</button>

      <!-- Startup overlay -->
      <div id="startup-overlay" class="overlay">
        <div class="card">

          <!-- Tab navigation -->
          <div class="panel-tabs">
            <button class="panel-tab active" data-tab="config" type="button">設定</button>
            <button class="panel-tab" data-tab="map" type="button">マップ</button>
          </div>

          <!-- Config panel -->
          <div id="tab-panel-config">
            <h1>ロケーションベース AR + 音声</h1>
            <p>小型水門モデルを現在地基準で空間に配置し、開始時に音声案内も再生します。</p>
            <div class="field">
              <label for="config-select">配置設定</label>
              <select id="config-select">
                <option value="miyako-suimon">宮古水門</option>
                <option value="old-place">旧配置地点</option>
                <option value="takizawa">滝沢</option>
              </select>
            </div>
            <p id="config-description" class="field-help">現在地付近に閉伊川水門の小型モデルを配置します。</p>
            <div class="actions">
              <button id="start-button" class="btn" type="button" disabled>AR を開始</button>
              <a class="link-btn" href="viewer.html">viewer を開く</a>
              <a class="link-btn" href="index.html">ホームへ戻る</a>
            </div>
            <div id="startup-status" class="status">設定ファイルを読み込み中...</div>
          </div>

          <!-- Map panel -->
          <div id="tab-panel-map" hidden>
            <p class="map-panel-title">配置マップ</p>
            <canvas id="map-canvas" width="504" height="288"></canvas>
            <p id="map-status">GPS を待っています...</p>
          </div>

        </div>
      </div>

      <!-- HUD -->
      <div class="hud">
        <div class="hud-card">
          <strong>suimonAR audio</strong>
          <p id="mode-label">mode: standby</p>
        </div>
        <div class="hud-card">
          <strong>status</strong>
          <p id="runtime-status">開始待ち</p>
        </div>
        <div class="hud-card">
          <strong>gps</strong>
          <p id="gps-status">GPS: 開始待ち</p>
        </div>
        <div class="hud-card">
          <strong>audio</strong>
          <div class="audio-player">
            <button id="audio-toggle" class="audio-play-btn" type="button" disabled aria-label="再生">▶</button>
            <div class="audio-seek-wrap">
              <input id="audio-seek" type="range" min="0" max="100" value="0" step="0.1"
                     class="audio-seek" disabled aria-label="シーク" />
              <div class="audio-time">
                <span id="audio-current-time">0:00</span>
                <span id="audio-duration">0:00</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/location-ar/main.ts"></script>
  </body>
</html>
