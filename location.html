<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>suimonAR Location</title>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #050914;
        color: #f7f9fc;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #xr-root {
        position: fixed;
        inset: 0;
      }
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at top left, rgba(110, 89, 255, 0.28), transparent 24%), rgba(6, 8, 18, 0.88);
        backdrop-filter: blur(12px);
      }
      .card {
        width: min(520px, 100%);
        padding: 28px;
        border-radius: 24px;
        border: 1px solid rgba(255,255,255,0.16);
        background: rgba(16, 21, 44, 0.88);
        box-shadow: 0 30px 80px rgba(0,0,0,0.3);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 28px;
      }
      p {
        margin: 0 0 14px;
        line-height: 1.7;
        color: rgba(247,249,252,0.82);
      }
      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .btn, .link-btn {
        border: 0;
        border-radius: 999px;
        padding: 12px 18px;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
      }
      .btn {
        color: #05121c;
        background: linear-gradient(135deg, #7dd3fc, #c4b5fd);
      }
      .btn:disabled {
        opacity: 0.5;
      }
      .link-btn {
        color: #fff;
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.16);
      }
      .status {
        margin-top: 12px;
        padding: 12px 14px;
        border-radius: 16px;
        background: rgba(255,255,255,0.06);
        color: #dbeafe;
        font-size: 13px;
      }
      .hud {
        position: fixed;
        left: 18px;
        right: 18px;
        bottom: 18px;
        z-index: 6;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 12px;
        pointer-events: none;
      }
      .hud-card {
        padding: 12px 14px;
        border-radius: 18px;
        background: rgba(8, 11, 25, 0.78);
        border: 1px solid rgba(255,255,255,0.12);
        backdrop-filter: blur(10px);
      }
      .hud strong {
        display: block;
        margin-bottom: 4px;
      }
      .hud p {
        margin: 0;
        color: rgba(247,249,252,0.74);
        font-size: 12px;
      }
      .back-link {
        position: fixed;
        top: 18px;
        left: 18px;
        z-index: 7;
        padding: 10px 16px;
        border-radius: 999px;
        color: #fff;
        text-decoration: none;
        background: rgba(8, 11, 25, 0.78);
        border: 1px solid rgba(255,255,255,0.12);
        backdrop-filter: blur(10px);
      }
      @media (max-width: 720px) {
        .hud {
          flex-direction: column;
          align-items: stretch;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="xr-root"></div>
      <a class="back-link" href="index.html">← トップへ戻る</a>

      <div id="startup-overlay" class="overlay">
        <div class="card">
          <h1>ロケーションベース AR</h1>
          <p>Android Chrome では WebXR `immersive-ar`、iOS Safari などでは DeviceOrientation + GPS フォールバックで起動します。</p>
          <p>モデルはワールド空間に固定配置し、カメラ更新と分離して描画します。</p>
          <div class="actions">
            <button id="start-button" class="btn" type="button" disabled>AR を開始</button>
            <a class="link-btn" href="viewer.html">viewer を開く</a>
          </div>
          <div id="startup-status" class="status">設定ファイルを読み込み中...</div>
        </div>
      </div>

      <div class="hud">
        <div class="hud-card">
          <strong>suimonAR location</strong>
          <p id="mode-label">mode: standby</p>
        </div>
        <div class="hud-card">
          <strong>status</strong>
          <p id="runtime-status">開始待ち</p>
        </div>
      </div>
    </div>

    <script type="module" src="/src/location/main.ts"></script>
  </body>
</html>
