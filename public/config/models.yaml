# モデル情報のみを定義する YAML
# 水門モデルを先頭にして、AR 確認ページでは閉伊川水門を既定表示にします。

models:
  - id: suimon_audio
    name: "閉伊川水門 アニメーション"
    assetId: "suimon-small-audio-glb"
    glb: "suimon-small-with-audio-ar.glb"
    defaultHeight: 3
    defaultSize: 1
    defaultRotationY: 0

  - id: suimon
    name: "Suimon 水門"
    glb: "suimon-kousin.glb"  # src/models/suimon-kousin.glb
    defaultHeight: 3
    defaultSize: 1
    defaultRotationY: 0

