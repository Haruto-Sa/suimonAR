<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>suimonAR Location</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #f7f9fc;
        background: linear-gradient(145deg, #0d1221, #1d2755 55%, #37205d);
      }
      .card {
        width: min(520px, 100%);
        padding: 28px;
        border-radius: 24px;
        border: 1px solid rgba(255,255,255,0.14);
        background: rgba(14, 18, 38, 0.82);
        box-shadow: 0 24px 70px rgba(0,0,0,0.28);
      }
      h1 {
        margin: 0 0 10px;
      }
      p {
        margin: 0 0 14px;
        line-height: 1.7;
        color: rgba(247,249,252,0.8);
      }
      a {
        color: #9fd6ff;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>ロケーションベース AR</h1>
      <p>新しい WebXR + DeviceOrientation 構成へ差し替え中です。</p>
      <p>次のコミットでこのページに本実装を入れます。</p>
      <p><a href="index.html">← トップへ戻る</a></p>
    </main>
  </body>
</html>
